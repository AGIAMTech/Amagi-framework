name: ALTHEA YouTube Shorts Generator

on:
  schedule:
    # Every 4 hours at minute 17 (offset to avoid GitHub peak load)
    - cron: '17 */4 * * *'
  workflow_dispatch:
    # Manual trigger from Actions tab

permissions:
  contents: write   # Required for committing generated videos to repo

jobs:
  generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        working-directory: youtube-shorts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate YouTube Short
        working-directory: youtube-shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALTHEA_API_URL: ${{ secrets.ALTHEA_API_URL }}
          SAMBA_KEY: ${{ secrets.SAMBA_KEY }}
          TTS_VOICE: ru-RU-DmitryNeural
        run: |
          python youtube_shorts.py

      - name: List generated files
        if: always()
        working-directory: youtube-shorts
        run: |
          echo "=== output/ contents ==="
          ls -la output/ 2>/dev/null || echo "(empty)"
          echo ""
          echo "=== State file ==="
          cat output/.processed_ids.json 2>/dev/null || echo "(no state)"

      - name: Commit generated video to repo
        if: success()
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-add .mp4 files (they're gitignored by default)
          find youtube-shorts/output -name "*.mp4" -type f -exec git add -f {} \;

          # Commit if there are changes
          if git diff --cached --quiet; then
            echo "No new video to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "🎬 Add YouTube Short — $TIMESTAMP

            Generated by GitHub Actions.
            See: https://www.youtube.com/@ALTHEAResearchBrief"
            git push
            echo "Pushed video to repo"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-logs-${{ github.run_id }}
          path: |
            /tmp/youtube_shorts.log
            youtube-shorts/output/
          retention-days: 7
