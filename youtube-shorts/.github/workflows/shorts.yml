name: ALTHEA YouTube Shorts Generator

on:
  schedule:
    # Every 4 hours at minute 17 (offset to avoid GitHub peak load)
    # 6 runs/day = 9,600 YouTube quota units (within 10,000 daily limit)
    - cron: '17 */4 * * *'
  workflow_dispatch:
    # Manual trigger from Actions tab

permissions:
  contents: read   # Read-only — we don't commit videos to repo anymore

jobs:
  generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        working-directory: youtube-shorts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate YouTube Short
        working-directory: youtube-shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALTHEA_API_URL: ${{ secrets.ALTHEA_API_URL }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TTS_VOICE: ru-RU-DmitryNeural
        run: |
          python youtube_shorts.py

      - name: Summary
        if: always()
        working-directory: youtube-shorts
        run: |
          echo "=== Run summary ==="
          echo "Timestamp: $(date -u)"
          echo ""
          echo "=== Output dir ==="
          ls -la output/ 2>/dev/null || echo "(empty)"
          echo ""
          echo "=== State file ==="
          cat output/.processed_ids.json 2>/dev/null || echo "(no state)"
          echo ""
          echo "=== Last log entries ==="
          tail -20 /tmp/youtube_shorts.log 2>/dev/null || echo "(no log)"

      - name: Upload artifacts (logs + video) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-debug-${{ github.run_id }}
          path: |
            /tmp/youtube_shorts.log
            youtube-shorts/output/
          retention-days: 3

      - name: Upload video artifact (always, for inspection)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video-${{ github.run_id }}
          path: youtube-shorts/output/*.mp4
          retention-days: 1   # Auto-deleted after 24h — video is on YouTube
          if-no-files-found: ignore
